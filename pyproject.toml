[project]
name = "carbon-intensity-pipeline"
version = "0.1.0"
description = "ETL pipeline that collects UK carbon intensity data from a public API, validates it, stores it in PostgreSQL and serves results through a REST API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.uv]
package = false
